name: Build and publish kid app

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compute version
        id: ver
        run: echo "vc=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Pvc=${{ steps.ver.outputs.vc }} -Pvn=1.${{ steps.ver.outputs.vc }}

      - name: Publish APK + version manifest (over-the-air channel)
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          VC=${{ steps.ver.outputs.vc }}
          cat > kids-version.json <<EOF
          {
            "versionCode": $VC,
            "versionName": "1.$VC",
            "url": "https://raw.githubusercontent.com/cellhome397-eng/cellhomekids-app/main/app-debug.apk"
          }
          EOF
          git config user.name "Cell Home Build"
          git config user.email "build@cellhome.local"
          git add app-debug.apk kids-version.json
          git commit -m "Publish kid app build $VC [skip ci]" || echo "nothing to publish"
          git push
